spring.application.name=orcamento-por-voz-ia

# Banco (MySQL do compose.yml). Valores vêm do ambiente; ver .env.example.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:orcamento}
spring.datasource.username=${MYSQL_USER:app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Provedor de IA compatível com a API da OpenAI (OpenAI ou Groq). Tudo vem do ambiente; ver .env.example.
# A chave NUNCA vai no código (P-002).
spring.ai.openai.api-key=${AI_API_KEY:${OPENAI_API_KEY:}}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${AI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.audio.transcription.model=${AI_TRANSCRIPTION_MODEL:whisper-1}
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.transcription.response-format=text
spring.ai.openai.audio.transcription.prompt=Comandos de orçamento pessoal em português do Brasil. Valores em reais, por exemplo quarenta e cinco reais ou doze e noventa. Categorias: mercado, alimentação fora, transporte, moradia, saúde, educação, lazer, outros.
spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=nova
spring.ai.openai.audio.speech.response-format=mp3

# Upload de áudio (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.fuso=America/Sao_Paulo
app.pendencia.minutos=5

# Resposta falada (mp3). Desligue quando o provedor não gera voz em português (ex.: Groq). Ver ADR D5.
app.fala.habilitada=${FALA_HABILITADA:true}

# Provedores com modelos de raciocínio (ex.: Groq com openai/gpt-oss-*): pede a resposta sem o raciocínio.
app.ia.sem-raciocinio=${AI_SEM_RACIOCINIO:false}
