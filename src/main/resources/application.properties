spring.application.name=orcamento-por-voz-ia

# Banco (MySQL do compose.yml). Valores vêm do ambiente; ver .env.example.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:orcamento}
spring.datasource.username=${MYSQL_USER:app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenAI (a chave NUNCA vai no código: P-002)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.audio.transcription.model=whisper-1
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.transcription.response-format=text
spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=nova
spring.ai.openai.audio.speech.response-format=mp3

# Upload de áudio (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.fuso=America/Sao_Paulo
app.pendencia.minutos=5
